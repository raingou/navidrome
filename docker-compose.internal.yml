services:
  navidrome:
    build:
      context: https://github.com/raingou/navidrome.git#master
    container_name: navidrome
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NAVIDROME_PORT:-4533}:4533"
    environment:
      ND_LOGLEVEL: info
      ND_SCANSCHEDULE: 1h
      ND_SESSIONTIMEOUT: 24h
      ND_ENABLEDOWNLOADS: "true"
      ND_ENABLESHARING: "true"
      ND_LYRICSPRIORITY: .lrc,.txt,embedded
    volumes:
      - ${NAVIDROME_DATA_DIR:-./data}:/data
      - ${MUSIC_DIR:?Set MUSIC_DIR to the existing music directory}:/music

