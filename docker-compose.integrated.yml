services:
  navidrome:
    build: .
    container_name: navidrome
    restart: unless-stopped
    ports:
      - "${NAVIDROME_PORT:-4533}:4533"
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_UIOnlineMusicURL: ${ONLINE_MUSIC_PUBLIC_URL:?Set ONLINE_MUSIC_PUBLIC_URL, for example http://192.168.1.10:3000}
    volumes:
      - ${NAVIDROME_DATA_DIR:-./data}:/data
      - ${MUSIC_DIR:?Set MUSIC_DIR to your existing Navidrome music directory}:/music:ro

  online-music:
    build: https://github.com/raingou/musicdown.git#main
    container_name: navidrome-online-music
    restart: unless-stopped
    ports:
      - "${ONLINE_MUSIC_PORT:-3000}:3000"
    environment:
      PORT: 3000
      ENABLE_DOWNLOAD: 1
      MUSIC_LIBRARY_PATH: /music
    volumes:
      - ${MUSIC_DIR}:/music
